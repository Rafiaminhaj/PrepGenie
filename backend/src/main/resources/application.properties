spring.datasource.url=jdbc:h2:mem:prepgenie;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Google Gemini API Key
openrouter.api.key=${OPENROUTER_API_KEY:default_openrouter_key}
gemini.api.key=${GEMINI_API_KEY:default_gemini_key}

# Server port configuration for Render
server.port=${PORT:8080}
